[workspace]
resolver = "3"
members = ["crates/spire-core", "crates/spire-data", "crates/spire-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
spire-core = { path = "crates/spire-core" }
spire-data = { path = "crates/spire-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_plot = { version = "0.38", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Smallest, fastest release binary: whole-program optimisation, one codegen
# unit, no unwinding tables. Build time is the price.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
