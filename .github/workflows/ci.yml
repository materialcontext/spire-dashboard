name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for eframe
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Windows- and macOS-only code (spire-platform, the title bar) is
  # compiled out on Linux, so lint it on those systems too.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The companion mod (C#). Builds without the game: see mod/Sts2Stub.
  # The zip is what players drop into <game>/mods/.
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build mod/SpireDashboardLink/SpireDashboardLink.csproj -c Release
      - name: Package
        run: |
          mkdir -p package/SpireDashboardLink
          cp mod/SpireDashboardLink/bin/Release/net8.0/SpireDashboardLink.dll package/SpireDashboardLink/
          cp mod/SpireDashboardLink/SpireDashboardLink.json package/SpireDashboardLink/
      - uses: actions/upload-artifact@v4
        with:
          name: SpireDashboardLink
          path: package/
