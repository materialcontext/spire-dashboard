[package]
name = "spire-app"
description = "egui dashboard for planning Slay the Spire 2 runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "spire-dashboard"
path = "src/main.rs"

[dependencies]
spire-core.workspace = true
spire-data.workspace = true
spire-platform.workspace = true
eframe.workspace = true
egui_plot.workspace = true

# Screen-reader support (AccessKit) on Windows and macOS. Everything that
# talks to the OS is in spire-platform.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { workspace = true, features = ["accesskit"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
